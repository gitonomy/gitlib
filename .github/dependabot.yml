version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: composer
    directories:
      - /tools/php-cs-fixer
      - /tools/phpstan
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /tools/zensical
    schedule:
      interval: monthly
    groups:
      zensical:
        patterns: ['*']
